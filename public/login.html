<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Admin Dashboard — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f13;
    --surface: #18181f;
    --border: #2a2a38;
    --accent: #7c6af7;
    --accent-hover: #6b59e6;
    --text: #e8e8f0;
    --muted: #888;
    --error: #f87171;
    --success: #4ade80;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 32px;
  }
  .logo svg { width: 36px; height: 36px; }
  .logo-text { font-size: 16px; font-weight: 600; }
  .logo-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 28px; }
  label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.15s;
    margin-bottom: 16px;
  }
  input:focus { border-color: var(--accent); }
  .btn {
    width: 100%;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #fff;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    padding: 11px;
    transition: background 0.15s;
    margin-top: 4px;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .msg {
    font-size: 13px;
    margin-top: 16px;
    padding: 10px 14px;
    border-radius: 8px;
    display: none;
  }
  .msg.error { background: rgba(248,113,113,0.12); color: var(--error); border: 1px solid rgba(248,113,113,0.3); display: block; }
  .msg.success { background: rgba(74,222,128,0.12); color: var(--success); border: 1px solid rgba(74,222,128,0.3); display: block; }
  .forgot { text-align: center; margin-top: 20px; }
  .forgot a { color: var(--accent); font-size: 12px; cursor: pointer; text-decoration: none; }
  .forgot a:hover { text-decoration: underline; }
  .reset-section { display: none; margin-top: 24px; border-top: 1px solid var(--border); padding-top: 24px; }
  .reset-section.open { display: block; }
  .reset-section h2 { font-size: 15px; margin-bottom: 6px; }
  .reset-section p { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="20" cy="20" r="4" fill="#7c6af7"/>
      <circle cx="20" cy="7" r="2.5" fill="#7c6af7" opacity="0.8"/>
      <circle cx="20" cy="33" r="2.5" fill="#7c6af7" opacity="0.8"/>
      <circle cx="7" cy="20" r="2.5" fill="#7c6af7" opacity="0.8"/>
      <circle cx="33" cy="20" r="2.5" fill="#7c6af7" opacity="0.8"/>
      <circle cx="10" cy="10" r="2" fill="#a78bfa" opacity="0.6"/>
      <circle cx="30" cy="10" r="2" fill="#a78bfa" opacity="0.6"/>
      <circle cx="10" cy="30" r="2" fill="#a78bfa" opacity="0.6"/>
      <circle cx="30" cy="30" r="2" fill="#a78bfa" opacity="0.6"/>
    </svg>
    <div>
      <div class="logo-text">AI Admin Dashboard</div>
      <div class="logo-sub">Metric Property Management</div>
    </div>
  </div>

  <h1>Sign in</h1>
  <p class="subtitle">Use your Metric email address</p>

  <form id="login-form">
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="you@metricpropertymanagement.com" autocomplete="email" required>
    <label for="password">Password</label>
    <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
    <button class="btn" type="submit" id="login-btn">Sign in</button>
    <div class="msg" id="login-msg"></div>
  </form>

  <div class="forgot">
    <a id="forgot-toggle">Forgot password / First time setup</a>
  </div>

  <div class="reset-section" id="reset-section">
    <h2>Set or reset your password</h2>
    <p>Enter your Metric email and we'll send you a link to set your password.</p>
    <label for="reset-email">Email</label>
    <input id="reset-email" type="email" placeholder="you@metricpropertymanagement.com" autocomplete="email">
    <button class="btn" type="button" id="reset-btn">Send reset link</button>
    <div class="msg" id="reset-msg"></div>
  </div>
</div>

<script>
const loginForm = document.getElementById('login-form');
const loginBtn  = document.getElementById('login-btn');
const loginMsg  = document.getElementById('login-msg');

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  loginBtn.disabled = true;
  loginBtn.textContent = 'Signing in…';
  loginMsg.className = 'msg';
  loginMsg.textContent = '';

  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
      credentials: 'same-origin',
    });
    const data = await r.json();
    if (!r.ok) {
      loginMsg.className = 'msg error';
      loginMsg.textContent = data.error || 'Login failed';
      loginBtn.disabled = false;
      loginBtn.textContent = 'Sign in';
      return;
    }
    window.location.href = '/';
  } catch {
    loginMsg.className = 'msg error';
    loginMsg.textContent = 'Network error — try again';
    loginBtn.disabled = false;
    loginBtn.textContent = 'Sign in';
  }
});

document.getElementById('forgot-toggle').addEventListener('click', () => {
  document.getElementById('reset-section').classList.toggle('open');
});

document.getElementById('reset-btn').addEventListener('click', async () => {
  const email = document.getElementById('reset-email').value.trim();
  const resetMsg = document.getElementById('reset-msg');
  const resetBtn = document.getElementById('reset-btn');
  if (!email) { resetMsg.className = 'msg error'; resetMsg.textContent = 'Enter your email first'; return; }

  resetBtn.disabled = true;
  resetBtn.textContent = 'Sending…';
  resetMsg.className = 'msg';
  resetMsg.textContent = '';

  try {
    const r = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    const data = await r.json();
    if (!r.ok) {
      resetMsg.className = 'msg error';
      resetMsg.textContent = data.error || 'Failed to send reset email';
    } else {
      resetMsg.className = 'msg success';
      resetMsg.textContent = 'Email sent — check your inbox to set your password';
    }
  } catch {
    resetMsg.className = 'msg error';
    resetMsg.textContent = 'Network error — try again';
  }
  resetBtn.disabled = false;
  resetBtn.textContent = 'Send reset link';
});
</script>
</body>
</html>
