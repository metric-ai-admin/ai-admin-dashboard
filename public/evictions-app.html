<style>
  :root{
    --navy:#1B2A4A; --navyMid:#2D4070; --navyLight:#3D5590;
    --gold:#C9A84C; --offWhite:#F7F5F0; --white:#FFFFFF;
    --red:#B91C1C; --redLight:#FEE2E2;
    --amber:#B45309; --amberLight:#FEF3C7;
    --green:#166534; --greenLight:#DCFCE7;
    --purple:#6D28D9; --purpleLight:#EDE9FE;
    --teal:#0E7490; --tealLight:#CFFAFE;
    --orange:#C2410C; --orangeLight:#FFEDD5;
    --rose:#9F1239; --roseLight:#FFE4E6;
    --border:#E2DFD8; --muted:#6B7280; --text:#1C1917;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--offWhite);color:var(--text);font-family:'Barlow',sans-serif;}
  #root{min-height:100vh;display:flex;flex-direction:column;}
  h1,h2,h3,h4{font-family:'Barlow Condensed',sans-serif;margin:0;}
  button{font-family:'Barlow',sans-serif;cursor:pointer;}
  #cdn-error{
    display:none;position:fixed;inset:0;background:#fff5f5;color:#7f1d1d;
    align-items:center;justify-content:center;flex-direction:column;gap:8px;
    font-family:'Barlow',sans-serif;padding:40px;text-align:center;z-index:9999;
  }

  /* ---------- Top Bar ---------- */
  .topbar{
    background:var(--navy);color:var(--white);padding:12px 24px;
    display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,0.2);
    flex-wrap:wrap;gap:10px;
  }
  .logo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:22px;letter-spacing:0.5px;}
  .logo .accent{color:var(--gold);}
  .topbar-actions{display:flex;gap:10px;flex-wrap:wrap;}
  .btn{
    border:1px solid var(--navyLight);background:var(--navyMid);color:var(--white);
    padding:9px 16px;border-radius:6px;font-weight:600;font-size:13px;
    display:inline-flex;align-items:center;gap:6px;position:relative;overflow:hidden;
    transition:background .15s;
  }
  .btn:hover{background:var(--navyLight);}
  .btn:disabled,.btn.disabled{opacity:0.45;cursor:not-allowed;}
  .btn.gold{background:var(--gold);color:var(--navy);border-color:var(--gold);}
  .btn.gold:hover{background:#dcb95e;}
  .overlay-input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}

  /* ---------- Upload Screen ---------- */
  .upload-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
  .upload-card{
    border:2px dashed var(--navy);border-radius:14px;background:var(--white);
    max-width:460px;width:100%;padding:44px 36px;text-align:center;transition:.15s;
  }
  .upload-card.dragover{background:#eef1f8;border-color:var(--gold);}
  .upload-icon{font-size:42px;margin-bottom:10px;}
  .upload-card h2{font-size:26px;color:var(--navy);font-weight:800;margin-bottom:10px;}
  .upload-card p{color:var(--muted);font-size:14px;line-height:1.5;margin:6px 0;}
  .browse-btn{
    margin-top:18px;background:var(--navy);color:#fff;border:none;padding:13px 28px;
    border-radius:7px;font-weight:700;font-size:15px;position:relative;display:inline-block;overflow:hidden;
  }
  .included-banner{
    margin-top:20px;background:var(--white);border:1px solid var(--border);border-radius:8px;
    padding:12px 16px;font-size:12.5px;color:var(--navyMid);max-width:520px;
  }
  .included-banner b{color:var(--navy);}

  /* ---------- Yesterday Payments Panel ---------- */
  .yp-panel{
    background:var(--white);border-left:4px solid var(--gold);margin:14px 20px 0;
    padding:12px 18px;border-radius:6px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    font-size:13.5px;
  }
  .yp-title{font-weight:700;color:var(--navy);font-family:'Barlow Condensed',sans-serif;font-size:15px;}
  .yp-total{font-weight:800;color:var(--green);}
  .yp-agent{display:flex;gap:6px;align-items:baseline;padding-left:14px;border-left:1px solid var(--border);}
  .yp-agent-name{font-weight:700;}
  .yp-none{color:var(--muted);font-style:italic;}

  /* ---------- Stat Cards ---------- */
  .stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:16px 20px 0;}
  .stats-row.six{grid-template-columns:repeat(6,1fr);}
  .stats-row.seven{grid-template-columns:repeat(7,1fr);}
  .stat-card{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:14px 16px;}
  .stat-label{font-size:11px;text-transform:uppercase;letter-spacing:0.6px;color:var(--muted);font-weight:600;}
  .stat-value{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:800;color:var(--navy);margin-top:4px;}
  .stat-value.small{font-size:22px;}
  .stat-value.critical{color:var(--red);}
  .stat-value.high{color:var(--amber);}
  .stat-value.completed{color:var(--green);}
  .stat-value.moveout{color:var(--purple);}
  .activities-status{padding:6px 20px 0;font-size:12px;color:var(--muted);font-weight:600;}

  /* ---------- Tabs ---------- */
  .tabs{display:flex;gap:4px;padding:18px 20px 0;border-bottom:1px solid var(--border);margin:0 0;}
  .tab{
    padding:10px 18px;font-weight:700;font-size:14px;color:var(--muted);
    border-bottom:3px solid transparent;background:none;border-top:none;border-left:none;border-right:none;
  }
  .tab.active{color:var(--navy);border-bottom-color:var(--gold);}

  /* ---------- Filter Bar ---------- */
  .filter-bar{padding:14px 20px;display:flex;flex-direction:column;gap:10px;}
  .pill-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .pill{
    border:1px solid var(--border);background:var(--white);border-radius:20px;padding:5px 12px;
    font-size:12px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px;
  }
  .pill.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .pill .count{background:rgba(0,0,0,0.08);border-radius:10px;padding:0 6px;font-size:11px;}
  .pill.active .count{background:rgba(255,255,255,0.25);}
  .filter-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .filter-controls select, .filter-controls input[type=text]{
    border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:13px;font-family:'Barlow',sans-serif;
  }
  .toggle-btn{
    border:1px solid var(--navy);background:var(--white);color:var(--navy);border-radius:6px;
    padding:7px 14px;font-size:12.5px;font-weight:700;
  }
  .toggle-btn.on{background:var(--navy);color:#fff;}

  /* ---------- Table ---------- */
  .table-wrap{padding:0 20px 30px;overflow-x:auto;}
  table{width:100%;border-collapse:collapse;background:var(--white);border:1px solid var(--border);border-radius:8px;overflow:hidden;table-layout:fixed;}
  thead th{
    background:var(--navy);color:#fff;text-align:left;font-size:12.5px;text-transform:uppercase;
    letter-spacing:0.5px;padding:12px 14px;font-weight:700;
  }
  tbody td{padding:14px;font-size:15px;border-bottom:1px solid var(--border);vertical-align:top;overflow-wrap:break-word;}
  .data-row{cursor:pointer;}
  .data-row:hover{background:#f7f8fb;}
  .badge{
    display:inline-block;border-radius:4px;padding:3px 9px;font-size:12.5px;font-weight:700;
  }
  .urgency-pill{
    display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:3px 9px;font-size:12px;font-weight:800;
    letter-spacing:0.3px;margin-bottom:5px;
  }
  .moveout-badge{
    display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:3px 9px;font-size:12px;font-weight:800;
    letter-spacing:0.3px;margin-bottom:5px;margin-left:6px;background:var(--purpleLight);color:var(--purple);
    border:1px solid var(--purple);
  }
  .action-text{font-size:14.5px;color:var(--text);line-height:1.5;display:block;}
  .tenant-name{font-weight:700;font-family:'Barlow Condensed',sans-serif;font-size:17px;margin-bottom:3px;}
  .past-due{color:var(--red);font-weight:700;}
  .row-num{color:var(--muted);font-size:13.5px;}
  .profile-link{color:inherit;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px;}
  .profile-link:hover{color:var(--navyMid);text-decoration-style:solid;}
  .profile-open-link{display:block;margin-top:10px;font-size:13px;font-weight:700;color:var(--navyMid);text-decoration:none;}
  .profile-open-link:hover{text-decoration:underline;}
  .completed-toggle{
    display:inline-block;margin-top:7px;border:1px solid var(--border);background:var(--white);
    color:var(--muted);font-size:12.5px;font-weight:700;border-radius:5px;padding:5px 11px;
  }
  .completed-toggle:hover{border-color:var(--navy);color:var(--navy);}
  .completed-toggle.done{background:var(--greenLight);border-color:var(--green);color:var(--green);}
  .completed-toggle.full{display:block;width:100%;padding:10px;font-size:13.5px;text-align:center;}
  .row-completed{opacity:0.55;}
  .row-completed .tenant-name{text-decoration:line-through;}

  /* ---------- Expanded Row ---------- */
  .expand-row td{background:#fbfbf8;padding:18px;}
  .expand-grid{display:grid;grid-template-columns:220px 1fr;gap:20px;}
  .side-box{background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px;}
  .right-col{display:flex;flex-direction:column;gap:14px;}
  .action-banner{border-radius:8px;padding:16px 18px;font-size:15.5px;line-height:1.5;font-weight:600;border-left:5px solid;}
  .panel{background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px 16px;}
  .panel h4{font-size:13px;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);margin-bottom:10px;}
  .detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .detail-item .dlabel{font-size:11.5px;color:var(--muted);text-transform:uppercase;font-weight:700;}
  .detail-item .dval{font-size:15px;font-weight:700;margin-top:2px;}
  .dval.stale{color:var(--red);}
  .dval.dash{color:#9ca3af;font-weight:500;}
  .case-row-wrap{border-bottom:1px dashed var(--border);}
  .case-row-wrap:last-child{border-bottom:none;}
  .case-row{display:flex;justify-content:space-between;padding:6px 0;font-size:14.5px;border-bottom:none;}
  .case-overdue-bold{font-size:19px;font-weight:900;color:var(--red);padding:2px 0 8px;letter-spacing:0.2px;}
  .case-row:last-child{border-bottom:none;}
  .case-label{color:var(--muted);font-weight:600;}
  .case-badge{font-size:10px;font-weight:800;border-radius:4px;padding:1px 6px;margin-left:6px;}
  textarea.session-notes{width:100%;min-height:70px;border:1px solid var(--border);border-radius:6px;padding:10px;font-family:'Barlow',sans-serif;font-size:14.5px;resize:vertical;}
  .appfolio-notes{font-size:14px;color:var(--muted);white-space:pre-wrap;max-height:120px;overflow-y:auto;}
  .activity-log{max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;}
  .activity-item{border:1px solid var(--border);border-radius:6px;padding:8px 10px;background:#fbfbf8;}
  .activity-item-head{display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap;}
  .activity-date{font-weight:700;font-size:13px;color:var(--navy);}
  .activity-label-badge{font-size:10px;font-weight:700;background:var(--tealLight);color:var(--teal);border-radius:4px;padding:1px 6px;text-transform:uppercase;}
  .activity-status{font-size:10px;color:var(--muted);font-weight:600;}
  .activity-text{font-size:14px;color:var(--text);white-space:pre-wrap;}
  .activity-by{font-size:12px;color:var(--muted);margin-top:3px;}
  .activity-more{font-size:11.5px;color:var(--muted);text-align:center;padding:4px;font-style:italic;}

  /* ---------- Grades Panel ---------- */
  .grades-panel{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;padding:20px;}
  .grade-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:24px;text-align:center;}
  .grade-agent{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:20px;color:var(--navy);margin-bottom:6px;}
  .grade-score{font-family:'Barlow Condensed',sans-serif;font-size:52px;font-weight:900;color:var(--navy);}
  .grade-letter{font-size:28px;color:var(--gold);margin-left:6px;}
  .grade-stats{display:flex;justify-content:center;gap:18px;margin-top:14px;font-size:12.5px;color:var(--muted);}
  .grade-breakdown{margin-top:18px;padding-top:14px;border-top:1px solid var(--border);text-align:left;font-size:13px;}
  .grade-breakdown-title{font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);font-weight:700;margin-bottom:8px;}
  .grade-breakdown-row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;color:var(--text);}
  .grade-breakdown-row.muted{color:var(--muted);font-style:italic;}
  .grade-breakdown-pts{font-weight:700;color:var(--red);white-space:nowrap;}
  .grade-breakdown-final{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);font-weight:800;font-family:'Barlow Condensed',sans-serif;font-size:16px;color:var(--navy);text-align:right;}
  .grade-legend{max-width:900px;margin:20px auto 0;background:var(--white);border:1px solid var(--border);border-radius:8px;padding:16px 20px;font-size:13px;line-height:1.7;color:var(--text);}
  .grade-stats div{font-weight:600;}

  /* ---------- Footer ---------- */
  .footer{text-align:center;padding:16px;color:var(--gold);background:var(--navy);font-size:12px;letter-spacing:0.5px;font-weight:600;}

  @media (max-width: 900px){
    .stats-row, .stats-row.six, .stats-row.seven{grid-template-columns:repeat(2,1fr);}
    .expand-grid{grid-template-columns:1fr;}
    .detail-grid{grid-template-columns:repeat(2,1fr);}
    .grades-panel{grid-template-columns:1fr;}
  }
</style>
</head>

const {

} = React;

/* =========================================================
   COLOR PALETTE
========================================================= */
const C = {
  navy: '#1B2A4A',
  navyMid: '#2D4070',
  navyLight: '#3D5590',
  gold: '#C9A84C',
  offWhite: '#F7F5F0',
  white: '#FFFFFF',
  red: '#B91C1C',
  redLight: '#FEE2E2',

/* =========================================================
   STAGE DEFINITIONS
========================================================= */
const CURRENT_AGENTS = ['Karla'];
const STAGES = [{
  id: 'NEED_TO_FILE',
  label: 'Need To File',
  color: C.red,
  light: C.redLight
}, {
  id: 'NEED_REFILE',
  label: 'Need to Refile',
  color: C.rose,
  light: C.roseLight
}, {
  id: 'FILED',
  label: 'Eviction Filed',
  color: C.amber,

}, {

}];
const STAGE_MAP = {};
STAGES.forEach(s => STAGE_MAP[s.id] = s);
const EVICTION_STAGES = new Set(STAGES.map(s => s.id).filter(id => !['RESOLVED', 'BALANCE_ONLY', 'OTHER'].includes(id)));
const STAGE_RANK = ['BALANCE_ONLY', 'OTHER', 'NEED_TO_FILE', 'NEED_REFILE', 'FILED', 'JP_SCHEDULED', 'COUNTY_COURT', 'NEED_WRIT', 'WRIT_PENDING', 'WRIT_EXECUTION', 'RESOLVED'];
function stageRankOf(stage) {
  if (!stage) return -1;
  const idx = STAGE_RANK.indexOf(stage);
  return idx === -1 ? -1 : idx;
}
const URGENCY_MAP = {

/* =========================================================
   UTILITY FUNCTIONS
========================================================= */
function startOfDay(d) {
  const x = new Date(d);
  x.setHours(0, 0, 0, 0);
  return x;
}
function parseDate(s) {
  if (!s) return null;
  if (s instanceof Date) return isNaN(s.getTime()) ? null : s;
  let str = String(s).replace(/"/g, '').trim();
  if (!str) return null;
  let d;
  const m = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if (m) {
    let mo = parseInt(m[1], 10),
      da = parseInt(m[2], 10),
      yr = parseInt(m[3], 10);
    if (yr < 100) yr += 2000;
    d = new Date(yr, mo - 1, da);
  } else {
    d = new Date(str);
  }
  if (isNaN(d.getTime())) return null;
  if (d.getFullYear() < 1970 || d.getFullYear() > 2100) return null;
  return d;
}
function parseMoney(s) {

  const other = sheets.filter(s => !dateTabRe.test(s.name));
