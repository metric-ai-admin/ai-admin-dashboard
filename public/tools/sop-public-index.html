<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Procedimientos de Mantenimiento — Metric Property Management</title>
<style>
  :root{
    --ink:#15181d; --muted:#5d6570; --line:#dcdfe4; --bg:#fff; --card:#f7f8fa; --gold:#8a6d2f;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5}
  .wrap{max-width:820px;margin:0 auto;padding:28px 16px 64px}
  header{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:22px}
  h1{margin:0 0 4px;font-size:1.6rem;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:.95rem;margin:0}
  .search{width:100%;padding:11px 13px;font-size:1rem;font-family:inherit;border:1px solid var(--line);
    border-radius:9px;margin:18px 0 6px}
  .count{color:var(--muted);font-size:.85rem;margin:0 0 18px}
  h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
    margin:26px 0 8px;font-weight:700}
  ul{list-style:none;margin:0;padding:0}
  li{border-bottom:1px solid var(--line)}
  li:first-child{border-top:1px solid var(--line)}
  a.sop{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    padding:13px 4px;color:inherit;text-decoration:none}
  a.sop:hover,a.sop:focus{background:var(--card)}
  .title{font-weight:600}
  .meta{color:var(--muted);font-size:.8rem;white-space:nowrap}
  .flag{display:inline-block;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;
    border:1px solid var(--gold);color:var(--gold);border-radius:4px;padding:1px 5px;margin-left:8px;
    vertical-align:middle}
  .note{background:var(--card);border-left:3px solid var(--gold);padding:11px 14px;margin:18px 0;
    font-size:.88rem;color:var(--muted);border-radius:0 6px 6px 0}
  .langs{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;
    align-self:flex-start}
  .langs button{font:inherit;font-size:.82rem;padding:6px 14px;border:0;background:var(--bg);
    color:var(--muted);cursor:pointer}
  .langs button[aria-pressed="true"]{background:var(--ink);color:#fff;font-weight:600}
  .head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);
    color:var(--muted);font-size:.8rem}
  .empty{color:var(--muted);padding:26px 0}
  @media print{
    .search,.count,footer,.note{display:none}
    a.sop{padding:5px 0}
    body{font-size:11pt}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-row">
      <div>
        <h1 id="h1">Procedimientos de Mantenimiento</h1>
        <p class="sub" id="sub">Metric Property Management &mdash; solo lectura</p>
      </div>
      <!-- Spanish first, and selected by default: most of the technicians do
           not read English. The choice is remembered in this browser only. -->
      <div class="langs" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="es" aria-pressed="true">Español</button>
        <button type="button" data-lang="en" aria-pressed="false">English</button>
      </div>
    </div>
  </header>

  <input id="q" class="search" type="search" placeholder="Buscar por título…" autocomplete="off"
    aria-label="Buscar procedimientos por título">
  <p class="count" id="count">Loading…</p>

  <div id="list"></div>

  <p class="note" id="reviewNote" hidden></p>

  <footer id="foot"></footer>
</div>

<script>
(function () {
  'use strict';
  // The token is in the URL this page was served from; it is never typed in
  // and never stored. The server has already checked it to serve this file.
  var TOKEN = '__SOP_TOKEN__';
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[c];
    });
  };

  /* Spanish is the DEFAULT. Most of the maintenance technicians do not read
     English, and this page exists for them; English is the fallback and the
     source of record. The choice is remembered per browser, and a browser that
     refuses storage simply gets Spanish every time, which is the right
     default anyway. */
  var LANG = 'es';
  try { if (localStorage.getItem('metricSopLang') === 'en') LANG = 'en'; } catch (e) {}

  var S = {
    es: {
      h1: 'Procedimientos de Mantenimiento',
      sub: 'Metric Property Management — solo lectura',
      search: 'Buscar por título…',
      count: function (n) { return n + (n === 1 ? ' procedimiento' : ' procedimientos'); },
      none: 'No hay nada que coincida.',
      error: 'No se pudo cargar la lista. Revisa la conexión y vuelve a abrir.',
      flag: 'falta revisar',
      review: 'Los procedimientos marcados <span class="flag">falta revisar</span> todavía no están aprobados. '
        + 'Síguelos tal como están escritos y avísale a Erick si algo no coincide con lo que haces en la propiedad.',
      foot: 'Esta página es solo de lectura. Toca un procedimiento para abrirlo e imprimirlo.',
      untranslated: 'en inglés',
      bilingual: 'inglés y español',
    },
    en: {
      h1: 'Maintenance SOPs',
      sub: 'Metric Property Management — read only',
      search: 'Filter by title…',
      count: function (n) { return n + (n === 1 ? ' procedure' : ' procedures'); },
      none: 'Nothing matches that.',
      error: 'Could not load the list. Check the connection and reload.',
      flag: 'needs review',
      review: 'Procedures marked <span class="flag">needs review</span> have not been signed off yet. '
        + 'Follow them as written, and tell Erick if something does not match what you do on site.',
      foot: 'This page is read only. Tap a procedure to open and print it.',
      untranslated: 'in English',
      bilingual: 'English and Spanish',
    },
  };

  var data = [];

  function chrome() {
    var t = S[LANG];
    document.documentElement.lang = LANG;
    document.getElementById('h1').textContent = t.h1;
    document.getElementById('sub').textContent = t.sub;
    document.getElementById('q').placeholder = t.search;
    document.getElementById('foot').textContent = t.foot;
    Array.prototype.forEach.call(document.querySelectorAll('.langs button'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.lang === LANG));
    });
  }

  function render() {
    var t = S[LANG];
    var q = (document.getElementById('q').value || '').trim().toLowerCase();
    var host = document.getElementById('list');
    var shown = 0, html = '', needsReview = false;
    data.forEach(function (group) {
      var items = group.sops.filter(function (s) {
        var title = (LANG === 'es' && s.title_es) ? s.title_es : s.title;
        return !q || String(title).toLowerCase().indexOf(q) >= 0;
      });
      if (!items.length) return;
      html += '<h2>' + esc(group.category) + '</h2><ul>';
      items.forEach(function (s) {
        shown++;
        if (s.status && s.status !== 'Current') needsReview = true;
        // Per SOP, not per page: one untranslated procedure must not drag the
        // whole list back into English.
        var useEs = LANG === 'es' && !!s.title_es;
        var title = useEs ? s.title_es : s.title;
        html += '<li><a class="sop" href="/sops/' + TOKEN + '/' + encodeURIComponent(s.slug) + '?lang=' + LANG + '">'
          + '<span class="title">' + esc(title)
          + (s.status && s.status !== 'Current' ? '<span class="flag">' + esc(t.flag) + '</span>' : '')
          + (LANG === 'es' && !s.title_es
            ? '<span class="flag">' + esc(s.bilingual ? t.bilingual : t.untranslated) + '</span>' : '')
          + '</span>'
          + '<span class="meta">' + esc(s.updated || '') + '</span></a></li>';
      });
      html += '</ul>';
    });
    host.innerHTML = html || '<p class="empty">' + esc(t.none) + '</p>';
    document.getElementById('count').textContent = t.count(shown);
    var note = document.getElementById('reviewNote');
    note.hidden = !needsReview;
    if (needsReview) note.innerHTML = t.review;
  }

  document.getElementById('q').addEventListener('input', render);
  Array.prototype.forEach.call(document.querySelectorAll('.langs button'), function (b) {
    b.addEventListener('click', function () {
      LANG = b.dataset.lang === 'en' ? 'en' : 'es';
      try { localStorage.setItem('metricSopLang', LANG); } catch (e) {}
      chrome(); render();
    });
  });

  chrome();
  fetch('/api/sop-public/' + TOKEN, { credentials: 'omit' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (j) { data = j.categories || []; render(); })
    .catch(function () {
      document.getElementById('count').textContent = '';
      document.getElementById('list').innerHTML =
        '<p class="empty">' + esc(S[LANG].error) + '</p>';
    });
})();
</script>
</body>
</html>
