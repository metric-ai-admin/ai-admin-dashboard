<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Maintenance SOPs — Metric Property Management</title>
<style>
  :root{
    --ink:#15181d; --muted:#5d6570; --line:#dcdfe4; --bg:#fff; --card:#f7f8fa; --gold:#8a6d2f;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5}
  .wrap{max-width:820px;margin:0 auto;padding:28px 16px 64px}
  header{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:22px}
  h1{margin:0 0 4px;font-size:1.6rem;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:.95rem;margin:0}
  .search{width:100%;padding:11px 13px;font-size:1rem;font-family:inherit;border:1px solid var(--line);
    border-radius:9px;margin:18px 0 6px}
  .count{color:var(--muted);font-size:.85rem;margin:0 0 18px}
  h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
    margin:26px 0 8px;font-weight:700}
  ul{list-style:none;margin:0;padding:0}
  li{border-bottom:1px solid var(--line)}
  li:first-child{border-top:1px solid var(--line)}
  a.sop{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    padding:13px 4px;color:inherit;text-decoration:none}
  a.sop:hover,a.sop:focus{background:var(--card)}
  .title{font-weight:600}
  .meta{color:var(--muted);font-size:.8rem;white-space:nowrap}
  .flag{display:inline-block;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;
    border:1px solid var(--gold);color:var(--gold);border-radius:4px;padding:1px 5px;margin-left:8px;
    vertical-align:middle}
  .note{background:var(--card);border-left:3px solid var(--gold);padding:11px 14px;margin:18px 0;
    font-size:.88rem;color:var(--muted);border-radius:0 6px 6px 0}
  footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);
    color:var(--muted);font-size:.8rem}
  .empty{color:var(--muted);padding:26px 0}
  @media print{
    .search,.count,footer,.note{display:none}
    a.sop{padding:5px 0}
    body{font-size:11pt}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Maintenance SOPs</h1>
    <p class="sub">Metric Property Management — read only</p>
  </header>

  <input id="q" class="search" type="search" placeholder="Filter by title…" autocomplete="off"
    aria-label="Filter standard operating procedures by title">
  <p class="count" id="count">Loading…</p>

  <div id="list"></div>

  <p class="note" id="reviewNote" hidden>
    Procedures marked <span class="flag">needs review</span> have not been signed off yet.
    Follow them as written, and tell Erick if something does not match what you do on site.
  </p>

  <footer>
    This page is read only. Tap a procedure to open and print it.
  </footer>
</div>

<script>
(function () {
  'use strict';
  // The token is in the URL this page was served from; it is never typed in
  // and never stored. The server has already checked it to serve this file.
  var TOKEN = '__SOP_TOKEN__';
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[c];
    });
  };
  var data = [];

  function render() {
    var q = (document.getElementById('q').value || '').trim().toLowerCase();
    var host = document.getElementById('list');
    var shown = 0, html = '', needsReview = false;
    data.forEach(function (group) {
      var items = group.sops.filter(function (s) {
        return !q || String(s.title).toLowerCase().indexOf(q) >= 0;
      });
      if (!items.length) return;
      html += '<h2>' + esc(group.category) + '</h2><ul>';
      items.forEach(function (s) {
        shown++;
        if (s.status && s.status !== 'Current') needsReview = true;
        html += '<li><a class="sop" href="/sops/' + TOKEN + '/' + encodeURIComponent(s.slug) + '">'
          + '<span class="title">' + esc(s.title)
          + (s.status && s.status !== 'Current' ? '<span class="flag">needs review</span>' : '')
          + '</span>'
          + '<span class="meta">' + esc(s.updated || '') + '</span></a></li>';
      });
      html += '</ul>';
    });
    host.innerHTML = html || '<p class="empty">Nothing matches that.</p>';
    document.getElementById('count').textContent =
      shown + (shown === 1 ? ' procedure' : ' procedures');
    document.getElementById('reviewNote').hidden = !needsReview;
  }

  document.getElementById('q').addEventListener('input', render);

  fetch('/api/sop-public/' + TOKEN, { credentials: 'omit' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (j) { data = j.categories || []; render(); })
    .catch(function () {
      document.getElementById('count').textContent = '';
      document.getElementById('list').innerHTML =
        '<p class="empty">Could not load the list. Check the connection and reload.</p>';
    });
})();
</script>
</body>
</html>
