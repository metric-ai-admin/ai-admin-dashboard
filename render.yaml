services:
  - type: web
    name: metric-ai-admin-dashboard
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    disk:
      # Render's filesystem is otherwise ephemeral — without this, every
      # deploy/restart wipes tasks.json, the Lyndsay message queue, the
      # Graph token cache, and everything else in data/. DATA_DIR below
      # points server.js at this mount instead of its own ./data folder.
      name: dashboard-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      # Must be the service's actual public URL (Render assigns this on
      # first deploy — update it here and redeploy once known). Required for
      # the Microsoft OAuth redirect to work; that exact URL + /auth/callback
      # must also be added as a redirect URI in the Azure App Registration.
      - key: APP_BASE_URL
        sync: false
      # Everything below must be set manually in the Render dashboard
      # (Environment tab) — never committed to the repo. See .env.example
      # for what each one does.
      - key: ASANA_TOKEN
        sync: false
      # Erick's personal Asana token. ASANA_TOKEN above is Arturo's and can only
      # see his own board, so Maintenance ▸ Asana Tasks asks for ?owner=erick and
      # the server switches to this one. Without it that view says so rather than
      # showing Arturo's tasks or a bare "no tasks".
      - key: ASANA_TOKEN_ERICK
        sync: false
      - key: ASANA_EXTRA_PROJECTS
        sync: false
      - key: GRAPH_TENANT_ID
        sync: false
      - key: GRAPH_CLIENT_ID
        sync: false
      - key: GRAPH_CLIENT_SECRET
        sync: false
      - key: MAILBOX_ARTURO
        sync: false
      - key: MAILBOX_LYNDSAY
        sync: false
      - key: METRIC_MAILBOXES
        sync: false
      - key: INBOX_TRACKING_MAPPING
        sync: false
      - key: EMAIL_REFRESH_MINUTES
        sync: false
      - key: REMINDER_MINUTES_CLIENT
        sync: false
      - key: REMINDER_MINUTES_INTERNAL
        sync: false
      - key: REMINDER_MINUTES_LEGAL
        sync: false
      - key: REMINDER_MINUTES_DEFAULT
        sync: false
      - key: ARTURO_TIMEZONE
        sync: false
      - key: LYNDSAY_TIMEZONE
        sync: false
      # Shared secret guarding /api/appfolio/* (billable amounts, technician
      # labour hours). The dashboard UI passes its session cookie instead; MCP
      # clients send it as the x-metric-key header. If this is unset the module
      # logs a warning and stays publicly readable.
      - key: METRIC_API_KEY
        sync: false
      # AppFolio Reports API v2 (read-only). Without all three, the Reports
      # Sync / Efficiency / Technician Activity views report "not configured".
      # Email Auto-Move (Phase 1). Both default to off in code, so leaving
      # them unset changes nothing. Turn ENABLED on with DRY_RUN still true
      # to get a log of what it would do, then flip DRY_RUN off.
      - key: AUTO_MOVE_ENABLED
        sync: false
      - key: AUTO_MOVE_DRY_RUN
        sync: false
      - key: APPFOLIO_CLIENT_ID
        sync: false
      - key: APPFOLIO_CLIENT_SECRET
        sync: false
      - key: APPFOLIO_SUBDOMAIN
        sync: false
