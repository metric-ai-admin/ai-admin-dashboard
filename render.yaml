services:
  - type: web
    name: metric-ai-admin-dashboard
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    disk:
      # Render's filesystem is otherwise ephemeral — without this, every
      # deploy/restart wipes tasks.json, the Lyndsay message queue, the
      # Graph token cache, and everything else in data/. DATA_DIR below
      # points server.js at this mount instead of its own ./data folder.
      name: dashboard-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      # Must be the service's actual public URL (Render assigns this on
      # first deploy — update it here and redeploy once known). Required for
      # the Microsoft OAuth redirect to work; that exact URL + /auth/callback
      # must also be added as a redirect URI in the Azure App Registration.
      - key: APP_BASE_URL
        sync: false
      # Everything below must be set manually in the Render dashboard
      # (Environment tab) — never committed to the repo. See .env.example
      # for what each one does.
      # Signing key for the dashboard's login cookie. Unset means nobody can
      # log in — server.js logs a warning at boot and every jwt.verify fails.
      # Generate once (openssl rand -hex 32) and set it in the Render
      # dashboard; changing it later logs everyone out.
      - key: JWT_SECRET
        sync: false
      - key: ASANA_TOKEN
        sync: false
      # Erick's personal Asana token. ASANA_TOKEN above is Arturo's and can only
      # see his own board, so Maintenance ▸ Asana Tasks asks for ?owner=erick and
      # the server switches to this one. Without it that view says so rather than
      # showing Arturo's tasks or a bare "no tasks".
      - key: ASANA_TOKEN_ERICK
        sync: false
      - key: ASANA_EXTRA_PROJECTS
        sync: false
      - key: GRAPH_TENANT_ID
        sync: false
      - key: GRAPH_CLIENT_ID
        sync: false
      - key: GRAPH_CLIENT_SECRET
        sync: false
      - key: MAILBOX_ARTURO
        sync: false
      - key: MAILBOX_LYNDSAY
        sync: false
      - key: METRIC_MAILBOXES
        sync: false
      - key: INBOX_TRACKING_MAPPING
        sync: false
      - key: EMAIL_REFRESH_MINUTES
        sync: false
      - key: REMINDER_MINUTES_CLIENT
        sync: false
      - key: REMINDER_MINUTES_INTERNAL
        sync: false
      - key: REMINDER_MINUTES_LEGAL
        sync: false
      - key: REMINDER_MINUTES_DEFAULT
        sync: false
      - key: ARTURO_TIMEZONE
        sync: false
      - key: LYNDSAY_TIMEZONE
        sync: false
      # Shared secret guarding /api/appfolio/* (billable amounts, technician
      # labour hours). The dashboard UI passes its session cookie instead; MCP
      # clients send it as the x-metric-key header. If this is unset the module
      # logs a warning and stays publicly readable.
      - key: METRIC_API_KEY
        sync: false
      # AppFolio Reports API v2 (read-only). Without all three, the Reports
      # Sync / Efficiency / Technician Activity views report "not configured".
      # Email Auto-Move (Phase 1). Both default to off in code, so leaving
      # them unset changes nothing. Turn ENABLED on with DRY_RUN still true
      # to get a log of what it would do, then flip DRY_RUN off.
      - key: AUTO_MOVE_ENABLED
        sync: false
      - key: AUTO_MOVE_DRY_RUN
        sync: false
      - key: APPFOLIO_CLIENT_ID
        sync: false
      - key: APPFOLIO_CLIENT_SECRET
        sync: false
      - key: APPFOLIO_SUBDOMAIN
        sync: false

      # Bearer token guarding /mcp (the StreamableHTTP MCP endpoint). That
      # endpoint is public on this service and its tools read resident,
      # collections, eviction and billable data. Unset means /mcp answers 503
      # rather than running open, so set this before pointing Claude Desktop
      # at it. Generate with: openssl rand -hex 32
      - key: MCP_AUTH_TOKEN
        sync: false

      # AppFolio Reports API v2 credentials — the Reports Sync, Efficiency and
      # Technician Activity views report "not configured" without them.
      - key: APPFOLIO_REPORTS_CLIENT_ID
        sync: false
      - key: APPFOLIO_REPORTS_CLIENT_SECRET
        sync: false

      # Asana workspace gid, used when a call needs to be scoped to the
      # workspace rather than to a single project.
      - key: ASANA_WORKSPACE
        sync: false

      # ---- BD CRM (Supabase) ----
      # Without SUPABASE_URL + SUPABASE_ANON_KEY the CRM module disables itself
      # at boot and its endpoints answer 503. The service role key bypasses RLS
      # and is required for bulk import and server-side writes.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Shared secret protecting the BD CRM API endpoints.
      - key: CRM_API_SECRET
        sync: false

      # ---- SimpleVoIP (call data / call grading) ----
      - key: SIMPLEVOIP_ACCOUNT_ID
        sync: false
      - key: SIMPLEVOIP_USER_ID
        sync: false

      # PORT is assigned by Render and read by server.js (falling back to 3001
      # locally). Declared here only so the full set is documented; do not pin
      # it to a value — Render sets it and overriding it breaks health checks.
      - key: PORT
        sync: false

  # =====================================================================
  # AppFolio Forms Agent — PHASE A (session lifecycle only)
  # =====================================================================
  # A SECOND service, not a job inside the dashboard. Three reasons, all of
  # them load-bearing:
  #
  #   Memory — headless Chromium wants 300-700MB for a real page and the
  #   dashboard runs on starter (512MB). An OOM inside the dashboard would
  #   restart it for the whole team, so the browser gets its own service and
  #   its own memory.
  #
  #   Disks cannot be shared — render.com/docs/disks: "You can't access a
  #   service's disk from any other service." The dashboard already owns
  #   dashboard-data at /var/data, so the browser profile needs a disk of its
  #   own. That profile is the ONLY thing keeping AppFolio from SMS-challenging
  #   every run, so it has to survive deploys.
  #
  #   Single instance — same page: "You can't scale a service to multiple
  #   instances if it has a disk attached." Attaching a disk therefore pins
  #   this to one instance, and the in-process cron cannot double-fire. That is
  #   what makes it safe to countersign from here in Phase B; a web service
  #   without a disk could quietly run two copies and sign every form twice.
  #
  # It is a WEB service rather than a cron job because the one-time sign-in
  # needs an HTTP surface a human can open, and Render cron jobs have none.
  - type: web
    name: metric-forms-agent
    env: docker
    region: oregon           # same region as the dashboard
    # standard, not starter: 512MB is not enough for Chromium plus Node, and an
    # OOM here means the daily run silently does nothing.
    plan: standard
    dockerfilePath: ./agent/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    disk:
      name: forms-agent-data
      mountPath: /var/data
      # Holds the Chromium profile (a few hundred MB once warm) plus the small
      # agent-state.json. 2GB leaves room for the profile to grow.
      sizeGB: 2
    envVars:
      - key: NODE_ENV
        value: production
      - key: AGENT_DATA_DIR
        value: /var/data
      # Daily at 08:00 Central, matching the reference script.
      - key: AGENT_SCHEDULE
        value: 0 8 * * *
      - key: AGENT_TIMEZONE
        value: America/Chicago
      - key: APPFOLIO_URL
        value: https://metricpropertymanagement.appfolio.com
      # This service's own public URL — used to build the setup link inside the
      # re-authentication email. Set after the first deploy assigns it.
      - key: AGENT_PUBLIC_URL
        sync: false
      # Shared secret the dashboard sends as x-agent-key to read /status and
      # POST /check. Without it those endpoints are open to anyone with the URL.
      - key: AGENT_API_KEY
        sync: false
      # ---- Microsoft Graph (re-authentication email) ----
      # Same app registration the dashboard uses. No SMTP, no mailbox password:
      # this replaces the reference script's EMAIL_PASSWORD entirely.
      - key: GRAPH_TENANT_ID
        sync: false
      - key: GRAPH_CLIENT_ID
        sync: false
      - key: GRAPH_CLIENT_SECRET
        sync: false
      - key: AGENT_MAIL_SENDER
        sync: false
      - key: AGENT_MAIL_TO
        sync: false
      # NOTE: there is deliberately no APPFOLIO_USERNAME / APPFOLIO_PASSWORD.
      # The agent never receives credentials. Sign-in happens once, by hand, in
      # a browser inside this container; what persists is the session, not a
      # password.
      - key: PORT
        sync: false
